services:
  dominus-api:
    build:
      context: api
    volumes:
      - ./api:/app
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    environment:
      SERVER_NAME: https://${SERVER_NAME:-api.dominus.localhost}, http://dominus-api
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-dominus}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.dominus-api-https.rule=HostSNI(`api.dominus.localhost`)"
      - "traefik.tcp.routers.dominus-api-https.entrypoints=websecure"
      - "traefik.tcp.routers.dominus-api-https.tls=true"
      # Active la retransmission brute sans déchiffrement
      - "traefik.tcp.routers.dominus-api-https.tls.passthrough=true"
      # Redirige vers le port HTTPS interne de FrankenPHP
      - "traefik.tcp.services.dominus-api-https.loadbalancer.server.port=443"

      # 2. Configuration du routeur HTTP pour redirection automatique (Port 80)
      - "traefik.http.routers.dominus-api-http.rule=Host(`api.dominus.localhost`)"
      - "traefik.http.routers.dominus-api-http.entrypoints=web"
      # Redirige vers le port HTTP de FrankenPHP (qui gérera la redirection HTTP -> HTTPS)
      - "traefik.http.services.dominus-api-http.loadbalancer.server.port=80"
    networks:
      - dominus-network
  
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dominus}
      # You should definitely change the password in production
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-dominus}", "-U", "${POSTGRES_USER:-admin}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./api/docker/db/data:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    networks:
      - dominus-network
###< doctrine/doctrine-bundle ###

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

volumes:
  caddy_data:
  caddy_config:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

networks:
  dominus-network:
    external: true
